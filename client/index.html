<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Capital Nusa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-header">
            <img src="assets/logo.png" alt="Capital Nusa Logo">
            <h1>Capital Nusa</h1>
        </div>
        <p class="welcome-text">&mdash; SELAMAT DATANG</p>
        <h2 class="main-heading">Kelola <span>investasi</span><br>Capital Nusa Anda.</h2>
        <p class="welcome-text">Masuk ke akun untuk melanjutkan dan memantau portofolio Anda.</p>
        
        <form id="loginForm">
            <!-- Menambahkan bidang tersembunyi untuk token CSRF yang diambil dari server -->
            <input type="hidden" name="_csrf" id="csrfToken" value="">

            <div class="input-group">
                <label for="phone">Nomor ponsel</label>
                <div style="display: flex; align-items: center;">
                    <span style="font-size: 16px; margin-right: 10px;">+62</span>
                    <input type="tel" id="phone" name="phone" placeholder="812 3456 7890" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password">Kata sandi</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" required>
                    <!-- Menambahkan ikon mata untuk toggle password (implementasi JS tidak ditampilkan) -->
                    <i class="far fa-eye" style="position: absolute; right: 10px; top: 12px; cursor: pointer; color: #666;"></i>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; margin: 10px 0; text-align: left;">
                <input type="checkbox" id="rememberMe" style="margin-right: 8px;">
                <label for="rememberMe" style="font-size: 12px; color: #666;">Ingat saya di perangkat ini</label>
            </div>

            <button type="submit" class="masuk-btn">Masuk ke akun</button>
        </form>
        
        <button class="buat-btn">Buat akun baru</button>
        
        <div class="ojk-badge">
            <img src="assets/ojk.png" alt="OJK Logo">
            <div>
                <strong>Diawasi & Terdaftar OJK</strong><br>
                <p style="margin: 3px 0 0;">Keamanan dana & data Anda terlindungi</p>
            </div>
            <i class="fas fa-check-circle" style="color: #4caf50; font-size: 20px; margin-left: auto;"></i>
        </div>
        
        <p style="font-size: 10px; color: #999; margin-top: 20px; text-align: center;">
            Capital Nusa terdaftar dan diawasi OJK. Investasi mengandung risiko &mdash; pahami sebelum memulai.
        </p>
    </div>
    <script src="js/auth.js"></script>
    <!-- Tambahkan library ikon (misalnya FontAwesome) untuk ikon mata dan dasbor -->
    <script src="https://kit.fontawesome.com/your_font_awesome_kit_id.js" crossorigin="anonymous"></script>
</body>
</html>
